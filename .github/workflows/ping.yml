name: Website Ping Automation

on:
  schedule:
    # প্রতি ১৫ মিনিট পর পর রান হবে (Cron format)
    - cron: '*/15 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য অপশন

jobs:
  ping-job:
    runs-running: ubuntu-latest
    steps:
      - name: Send HTTP Requests
        run: |
          echo "Sending requests to target websites..."
          
          # প্রথম ওয়েবসাইট
          curl -s -o /dev/null -w "%{http_code}" https://rh0099.github.io/Website-view3
          
          # দ্বিতীয় ওয়েবসাইট (প্রয়োজন হলে আরও যোগ করুন)
          # curl -s -o /dev/null -w "%{http_code}" https://your-second-site.com
