name: Website Ping Automation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Ping Multiple Websites
        run: |
          URLS=(
            "https://rh0099.github.io/Website-view3/"
            
          )

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EPOCH_TIME=$(date +%s)
          
          if [ -f status.json ]; then
            PREV_TOTAL=$(grep -o '"total_requests": [0-9]*' status.json | grep -o '[0-9]*' || echo 0)
          else
            PREV_TOTAL=0
          fi

          NEW_REQUESTS=${#URLS[@]}
          TOTAL_REQUESTS=$((PREV_TOTAL + NEW_REQUESTS))

          JSON_SITES="["
          SUCCESS_COUNT=0
          FAIL_COUNT=0

          for url in "${URLS[@]}"; do
            # URL-এর সাথে ক্যাশ ব্রাস্টার যোগ করে ইউনিক রিকোয়েস্ট পাঠানো
            if [[ "$url" == *\?* ]]; then
              PING_URL="${url}&_req=${EPOCH_TIME}"
            else
              PING_URL="${url}?_req=${EPOCH_TIME}"
            fi

            HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 10 "$PING_URL")
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi

            JSON_SITES+="{\"url\":\"$url\", \"status\":$HTTP_STATUS, \"last_check\":\"$TIMESTAMP\", \"req_id\":\"$EPOCH_TIME\"},"
          done

          JSON_SITES="${JSON_SITES%,}]"

          FINAL_JSON="{\"summary\": {\"total_requests\": $TOTAL_REQUESTS, \"last_batch_success\": $SUCCESS_COUNT, \"last_batch_failed\": $FAIL_COUNT, \"last_check\": \"$TIMESTAMP\"}, \"sites\": $JSON_SITES}"

          echo "$FINAL_JSON" > status.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Update request stats - ${EPOCH_TIME} [skip ci]" || exit 0
          git push
