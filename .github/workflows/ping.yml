name: Website Ping Automation

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি 5 মিনিট পর পর রান হবে
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Ping Websites and Log Status
        run: |
          # যেসব সাইট চেক করতে চান সেগুলোর লিঙ্কের অ্যারে
          URLS=(
            "https://rh0099.github.io/Website-view3"
            
          )

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          JSON_OUTPUT="["

          for url in "${URLS[@]}"; do
            # HTTP Status Code সংগ্রহ
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            
            JSON_OUTPUT+="{\"url\":\"$url\", \"status\":$HTTP_STATUS, \"last_check\":\"$TIMESTAMP\"},"
          done

          # শেষের কমা মুছে ফেলে JSON ফরম্যাট ঠিক করা
          JSON_OUTPUT="${JSON_OUTPUT%,}]"
          
          # status.json ফাইলে ডাটা রাইট করা
          echo "$JSON_OUTPUT" > status.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Auto-update website status log [skip ci]" || exit 0
          git push
